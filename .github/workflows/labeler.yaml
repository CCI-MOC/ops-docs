name: Label pull requests

on:
  pull_request_target:

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  label:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/labeler@v7
        with:
          configuration-path: .github/labeler.yaml
          sync-labels: true

      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Label by document standards
        run: npm run label-by-standards
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
