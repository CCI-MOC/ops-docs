---
eleventyExcludeFromCollections: true
title: Production Change Requests
---

<table>
  <tr>
    <th>ID</th><th>Title</th><th>Owner</th><th>When</th>
  </tr>

  {% for change in collections['production-change'] %}
  <tr>
    <td>
      <a href="{{ change.url }}">{{ change.data.pageId }}</a>
    </td>
    <td>
      {{ change.data.title }}
    </td>
    <td>
      {{ change.data.owner }}
    </td>
    <td>
      {{ change.data.when }}
    </td>
  </tr>
  {% endfor %}
</table>
